[project]
name = "afk-looper"
version = "0.1.0"
description = "Works through ready-for-agent GitHub issues with Claude Code, merging each one"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
afk = "afk_looper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afk_looper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
